<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dasbor Interaktif PJU Pemkot Makassar</title>
    
    <!-- CSS Leaflet (Untuk Peta) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f7f6;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        #status-info {
            padding: 10px 15px;
            border-radius: 5px;
            background-color: #e2e3e5;
            color: #383d41;
            font-weight: bold;
            text-align: center;
            margin-bottom: 10px;
        }
        #map {
            height: 450px;
            width: 100%;
            border-radius: 8px;
        }
        canvas {
            max-width: 100%;
            max-height: 400px;
        }
    </style>

    <!-- Library JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

    <div class="container">
        <h1>Dasbor Validasi PJU Pemkot Makassar</h1>

        <div id="status-info">Memuat data dari Google Sheets...</div>

        <!-- Kartu 1: Peta Interaktif -->
        <div class="card">
            <h2>Peta Persebaran Titik PJU</h2>
            <div id="map"></div>
        </div>

        <!-- Kartu 2: Grafik Jenis Lampu -->
        <div class="card">
            <h2>Jumlah Titik Berdasarkan Jenis Lampu</h2>
            <canvas id="myChart"></canvas>
        </div>
    </div>

    <script>
        const sheetId = '13TnOh22NXoQAzdabsR-wOYkTjqm0yudW3GiR37KgHNE';
        const csvUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv`;

        // 1. Inisialisasi Peta Makassar
        const map = L.map('map').setView([-5.147665, 119.432731], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        const markersGroup = L.featureGroup().addTo(map);

        // 2. Load Data CSV
        Papa.parse(csvUrl, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                const data = results.data;
                const statusDiv = document.getElementById('status-info');

                if (!data || data.length === 0) {
                    statusDiv.style.backgroundColor = '#f8d7da';
                    statusDiv.style.color = '#721c24';
                    statusDiv.innerHTML = 'Gagal memuat data / file Google Sheets kosong.';
                    return;
                }

                console.log("Header yang terdeteksi:", Object.keys(data[0]));

                // Fungsi bantu untuk mencari nilai kolom tanpa memedulikan spasi & kapitalisasi
                function getFieldValue(row, possibleNames) {
                    const keys = Object.keys(row);
                    for (let name of possibleNames) {
                        const matchedKey = keys.find(k => k.trim().toLowerCase() === name.toLowerCase());
                        if (matchedKey && row[matchedKey]) {
                            return row[matchedKey].toString().trim();
                        }
                    }
                    return '';
                }

                const lampCounts = {};
                let markersAdded = 0;

                data.forEach(row => {
                    // Cek Jenis Lampu
                    const jenis = getFieldValue(row, ['JENIS LAMPU', 'JENIS_LAMPU', 'LAMPU', 'JENIS']);
                    if (jenis) {
                        lampCounts[jenis] = (lampCounts[jenis] || 0) + 1;
                    }

                    // Cek Koordinat
                    let lat = null, lng = null;

                    const koordinatRaw = getFieldValue(row, ['KOORDINAT', 'KOORDINAT LOKASI', 'TITIK KOORDINAT']);
                    if (koordinatRaw && koordinatRaw.includes(',')) {
                        const parts = koordinatRaw.split(',');
                        lat = parseFloat(parts[0].trim());
                        lng = parseFloat(parts[1].trim());
                    } else {
                        // Jika terpisah LATITUDE dan LONGITUDE
                        const latRaw = getFieldValue(row, ['LATITUDE', 'LAT']);
                        const lngRaw = getFieldValue(row, ['LONGITUDE', 'LNG', 'LONG']);
                        if (latRaw && lngRaw) {
                            lat = parseFloat(latRaw);
                            lng = parseFloat(lngRaw);
                        }
                    }

                    // Tambahkan Marker jika koordinat valid
                    if (lat !== null && lng !== null && !isNaN(lat) && !isNaN(lng)) {
                        const alamat = getFieldValue(row, ['ALAMAT', 'LOKASI', 'NAMA JALAN']) || '-';
                        const watt = getFieldValue(row, ['WATT', 'DAYA']) || '-';
                        const kondisi = getFieldValue(row, ['NYALA / PADAM PADA SIANG HARI', 'KONDISI', 'STATUS']) || '-';

                        const popupContent = `
                            <div style="font-size: 13px;">
                                <b>Alamat:</b> ${alamat}<br>
                                <b>Jenis Lampu:</b> ${jenis || '-'}<br>
                                <b>Watt:</b> ${watt} W<br>
                                <b>Kondisi:</b> ${kondisi}
                            </div>
                        `;

                        const marker = L.marker([lat, lng]).bindPopup(popupContent);
                        markersGroup.addLayer(marker);
                        markersAdded++;
                    }
                });

                // Update Status Info
                statusDiv.style.backgroundColor = '#d4edda';
                statusDiv.style.color = '#155724';
                statusDiv.innerHTML = `Data Berhasil Dimuat! Total Baris: ${data.length} | Titik di Peta: ${markersAdded}`;

                // Jika ada titik di peta, atur zoom peta agar mencakup seluruh titik
                if (markersAdded > 0) {
                    map.fitBounds(markersGroup.getBounds());
                }

                // 3. Render Grafik Chart.js
                const labels = Object.keys(lampCounts);
                const values = Object.values(lampCounts);

                if (labels.length > 0) {
                    const ctx = document.getElementById('myChart').getContext('2d');
                    new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: labels,
                            datasets: [{
                                label: 'Jumlah Titik Lampu',
                                data: values,
                                backgroundColor: 'rgba(54, 162, 235, 0.6)',
                                borderColor: 'rgba(54, 162, 235, 1)',
                                borderWidth: 1
                            }]
                        },
                        options: {
                            responsive: true,
                            plugins: {
                                legend: { display: true }
                            },
                            scales: {
                                y: { beginAtZero: true }
                            }
                        }
                    });
                }
            },
            error: function(err) {
                console.error("Gagal membaca CSV:", err);
                const statusDiv = document.getElementById('status-info');
                statusDiv.style.backgroundColor = '#f8d7da';
                statusDiv.style.color = '#721c24';
                statusDiv.innerHTML = 'Terjadi kesalahan saat mengunduh data CSV dari Google Sheets.';
            }
        });
    </script>
</body>
</html>
