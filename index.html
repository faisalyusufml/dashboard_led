<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dasbor Interaktif PJU Pemkot Makassar</title>
    
    <!-- CSS Leaflet (Untuk Peta) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f7f6;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        #status-info {
            padding: 10px 15px;
            border-radius: 5px;
            background-color: #e2e3e5;
            color: #383d41;
            font-weight: bold;
            text-align: center;
            margin-bottom: 10px;
        }
        #map {
            height: 450px;
            width: 100%;
            border-radius: 8px;
        }
        canvas {
            max-width: 100%;
            max-height: 400px;
        }
    </style>

    <!-- Library JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

    <div class="container">
        <h1>Dasbor Validasi PJU Pemkot Makassar</h1>

        <div id="status-info">Memuat data dari Google Sheets...</div>

        <!-- Kartu 1: Peta Interaktif -->
        <div class="card">
            <h2>Peta Persebaran Titik PJU</h2>
            <div id="map"></div>
        </div>

        <!-- Kartu 2: Grafik Jenis Lampu -->
        <div class="card">
            <h2>Jumlah Titik Berdasarkan Jenis / Merk Lampu</h2>
            <canvas id="myChart"></canvas>
        </div>
    </div>

    <script>
        const sheetId = '13TnOh22NXoQAzdabsR-wOYkTjqm0yudW3GiR37KgHNE';
        const csvUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv`;

        // 1. Inisialisasi Peta Makassar
        const map = L.map('map').setView([-5.147665, 119.432731], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        const markersGroup = L.featureGroup().addTo(map);

        // 2. Load Data CSV (Pakai header: false agar bisa membaca kolom dengan nama ganda secara urut indeks)
        Papa.parse(csvUrl, {
            download: true,
            header: false,
            skipEmptyLines: true,
            complete: function(results) {
                const rows = results.data;
                const statusDiv = document.getElementById('status-info');

                if (!rows || rows.length <= 1) {
                    statusDiv.style.backgroundColor = '#f8d7da';
                    statusDiv.style.color = '#721c24';
                    statusDiv.innerHTML = 'Gagal memuat data / file Google Sheets kosong.';
                    return;
                }

                // Ambil Baris Header (Baris 0)
                const headers = rows[0].map(h => h.trim());
                
                // Cari Indeks Kolom Berdasarkan Posisinya
                const idxAlamat = headers.indexOf('Alamat');
                const idxKoordinat = headers.indexOf('Koordinat');
                
                // Ambil "Jenis Lampu" Pertama (Indeks pertama yang ketemu)
                const idxJenisLampu = headers.indexOf('Jenis Lampu');
                const idxWatt = headers.indexOf('Watt');

                const lampCounts = {};
                let markersAdded = 0;

                // Loop dari Baris ke-1 (Abaikan Header di Baris 0)
                for (let i = 1; i < rows.length; i++) {
                    const row = rows[i];
                    
                    const alamat = idxAlamat !== -1 ? row[idxAlamat] : '-';
                    const koordinatRaw = idxKoordinat !== -1 ? row[idxKoordinat] : '';
                    const jenis = idxJenisLampu !== -1 ? row[idxJenisLampu] : '';
                    const watt = idxWatt !== -1 ? row[idxWatt] : '-';

                    // Hitung Grafik Jenis/Merk Lampu
                    if (jenis && jenis.trim() !== '') {
                        const namaJenis = jenis.trim();
                        lampCounts[namaJenis] = (lampCounts[namaJenis] || 0) + 1;
                    }

                    // Plot Koordinat di Peta
                    if (koordinatRaw && koordinatRaw.includes(',')) {
                        const parts = koordinatRaw.split(',');
                        const lat = parseFloat(parts[0].trim());
                        const lng = parseFloat(parts[1].trim());

                        if (!isNaN(lat) && !isNaN(lng)) {
                            const popupContent = `
                                <div style="font-size: 13px;">
                                    <b>Alamat:</b> ${alamat || '-'}<br>
                                    <b>Jenis/Merk:</b> ${jenis || '-'}<br>
                                    <b>Watt:</b> ${watt || '-'} W
                                </div>
                            `;

                            const marker = L.marker([lat, lng]).bindPopup(popupContent);
                            markersGroup.addLayer(marker);
                            markersAdded++;
                        }
                    }
                }

                // Update Status Info
                statusDiv.style.backgroundColor = '#d4edda';
                statusDiv.style.color = '#155724';
                statusDiv.innerHTML = `Berhasil Dimuat! Total Baris Data: ${rows.length - 1} | Titik Peta Tampil: ${markersAdded}`;

                // Auto Fit Zoom Peta
                if (markersAdded > 0) {
                    map.fitBounds(markersGroup.getBounds());
                }

                // 3. Render Grafik Chart.js
                const labels = Object.keys(lampCounts);
                const values = Object.values(lampCounts);

                if (labels.length > 0) {
                    const ctx = document.getElementById('myChart').getContext('2d');
                    new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: labels,
                            datasets: [{
                                label: 'Jumlah Unit Titik',
                                data: values,
                                backgroundColor: [
                                    'rgba(54, 162, 235, 0.6)',
                                    'rgba(255, 99, 132, 0.6)',
                                    'rgba(75, 192, 192, 0.6)',
                                    'rgba(255, 206, 86, 0.6)',
                                    'rgba(153, 102, 255, 0.6)'
                                ],
                                borderWidth: 1
                            }]
                        },
                        options: {
                            responsive: true,
                            scales: {
                                y: { beginAtZero: true }
                            }
                        }
                    });
                }
            }
        });
    </script>
</body>
</html>
