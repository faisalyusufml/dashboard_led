<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dasbor Validasi PJU Pemkot Makassar</title>
    <!-- CSS Sederhana -->
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f7f6;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        canvas {
            max-width: 100%;
        }
    </style>
    <!-- Library Chart.js dan PapaParse (untuk baca CSV) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
</head>
<body>

    <div class="container">
        <h1>Dasbor Jumlah Titik Per Jenis Lampu PJU</h1>
        <canvas id="myChart"></canvas>
    </div>

    <script>
        // Tautan ekspor CSV dari Google Sheets Anda
        const csvUrl = 'https://docs.google.com/spreadsheets/d/13TnOh22NXoQAzdabsR-wOYkTjqm0yudW3GiR37KgHNE/export?format=csv';

        Papa.parse(csvUrl, {
            download: true,
            header: true,
            complete: function(results) {
                const data = results.data;
                
                // Menghitung jumlah titik lampu berdasarkan "JENIS LAMPU"
                const lampCounts = {};
                
                data.forEach(row => {
                    const jenis = row['JENIS LAMPU'];
                    if (jenis) {
                        lampCounts[jenis] = (lampCounts[jenis] || 0) + 1;
                    }
                });

                const labels = Object.keys(lampCounts);
                const values = Object.values(lampCounts);

                // Membuat Grafik Bar
                const ctx = document.getElementById('myChart').getContext('2d');
                new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Jumlah Titik Lampu',
                            data: values,
                            backgroundColor: 'rgba(54, 162, 235, 0.6)',
                            borderColor: 'rgba(54, 162, 235, 1)',
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        scales: {
                            y: {
                                beginAtZero: true,
                                title: {
                                    display: true,
                                    text: 'Jumlah Titik'
                                }
                            },
                            x: {
                                title: {
                                    display: true,
                                    text: 'Jenis Lampu'
                                }
                            }
                        }
                    }
                });
            }
        });
    </script>
</body>
</html>
